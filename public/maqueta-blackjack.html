<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maqueta — Blackjack VOLTIO</title>
<!--
  ════════════════════════════════════════════════════════════════════════
   MAQUETA DEL BLACKJACK — para mirar y jugar en local (Etapa B1).
   Ver ESTRUCTURA-BLACKJACK.md.

   ⚠ ESTO NO ES LA PANTALLA DEFINITIVA. La de verdad es `src/blackjack.jsx`
     y llega en la Etapa B3, dentro del salón, con la cabecera del saldo y el
     botón SALÓN. Esta es una hoja suelta para decidir el aspecto y para
     poder jugarle al motor antes de que exista la pantalla.

   ⚠ VIVE EN public/ SOLO PORQUE ASÍ COMPARTE ORIGEN CON LA API (si no, el
     navegador le bloquea las llamadas). Eso significa que se publicaría con
     un `npm run deploy`. SACARLA DE public/ ANTES DE PUBLICAR.

   Se abre en el servidor local, en /maqueta-blackjack.html.
   No usa React ni compilación: es un archivo suelto, se edita y se recarga.

   Lo único que hace es DIBUJAR lo que manda el servidor. No sabe cuánto vale
   una mano, no sabe quién ganó y no conoce la carta tapada. Si algo de eso
   apareciera acá adentro, estaría mal.
  ════════════════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --fondo:#0a0604; --paño:#0e3b2e; --oro:#ffd84a; --oro-suave:#d4a94a;
    --texto:#e8dcc0; --tenue:#bba876; --borde:#b88a28;
    --rojo:#c0392b; --verde:#4fd1a5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; min-height:100vh; background:var(--fondo); color:var(--texto);
    font-family:Georgia,'Times New Roman',serif;
    display:flex; flex-direction:column; align-items:center;
    padding:10px 12px 18px;
  }
  .marca{letter-spacing:6px; font-size:12px; color:var(--oro); font-weight:700}
  .marca small{display:block; letter-spacing:3px; font-size:8px; color:var(--tenue); margin-top:2px}
  .aviso{
    max-width:520px; width:100%; margin:8px 0 2px; padding:5px 10px; border-radius:6px;
    background:rgba(255,216,74,.07); border:1px solid rgba(255,216,74,.25);
    font-size:9.5px; color:var(--tenue); line-height:1.5; text-align:center;
  }

  /* ── La mesa ───────────────────────────────────────────────────────────
     Dos piezas, como una mesa de verdad: el CANTO (el borde acolchado de
     cuero donde se apoyan los codos) y el PAÑO adentro. Separarlos es lo que
     hace que deje de parecer un recuadro y empiece a parecer una mesa. */
  .mesa{
    width:100%; max-width:520px; margin-top:12px;
    border-radius:20px 20px 46px 46px; padding:9px;
    background:
      linear-gradient(180deg,#4a3520 0%,#2a1c0e 45%,#3d2a16 100%);
    box-shadow:
      0 14px 44px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,216,74,.28),
      inset 0 -2px 6px rgba(0,0,0,.6);
    border:1px solid #14100a;
  }
  .paño{
    border-radius:14px 14px 40px 40px; padding:12px 13px 14px; position:relative; overflow:hidden;
    background:
      /* el pozo de luz que cae sobre la mesa */
      radial-gradient(ellipse 130% 70% at 50% 2%, rgba(255,255,255,.13), transparent 62%),
      /* la sombra del fondo, donde no llega la lámpara */
      radial-gradient(ellipse 120% 60% at 50% 118%, rgba(0,0,0,.6), transparent 72%),
      /* el tejido del fieltro: dos tramas cruzadas, muy tenues */
      repeating-linear-gradient(45deg, rgba(0,0,0,.055) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
      linear-gradient(180deg,#155843 0%, var(--paño) 55%, #06251c 100%);
    box-shadow:inset 0 2px 10px rgba(0,0,0,.55);
  }
  /* La marca estampada en el fieltro, en la banda del arco — que es donde va
     en las mesas de verdad y es la única franja que nunca tapan las cartas.
     Va HUNDIDA, no escrita encima: el logo de una mesa está serigrafiado y
     casi no se ve, se nota cuando la luz le pega. De ahí el relieve (una luz
     arriba, una sombra abajo) y lo bajo de la opacidad: no compite con nada. */
  .marca-paño{
    text-align:center; margin:-16px 0 4px; pointer-events:none;
    font-size:23px; letter-spacing:11px; font-weight:700; font-family:Georgia,serif;
    color:rgba(255,236,190,.13);
    text-shadow:0 1px 0 rgba(255,255,255,.07), 0 -1px 1px rgba(0,0,0,.35);
  }

  /* El arco del crupier: la línea que en la mesa separa su zona de la del
     jugador, curvada como el borde de la mesa. */
  .arco{
    height:24px; margin:6px -13px 0; pointer-events:none;
    border-top:2px solid rgba(255,238,200,.32);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    box-shadow:0 -5px 0 -3px rgba(255,216,74,.14);
  }
  /* La leyenda impresa en el paño: las reglas de la casa. No es adorno —
     son las dos que el jugador tiene que saber antes de sentarse, y salen
     de la ficha de la mesa, no escritas a mano. */
  .letrero{
    text-align:center; margin:-10px 0 8px; line-height:1.75;
    color:rgba(255,236,190,.42); letter-spacing:1.6px; font-size:9px;
    text-shadow:0 1px 0 rgba(0,0,0,.5);
  }
  .letrero b{display:block; font-size:11.5px; letter-spacing:2.6px; color:rgba(255,216,74,.62); font-weight:700}


  .fila-crupier{display:flex; align-items:center; gap:10px; margin-bottom:4px}
  .avatar{
    width:38px; height:38px; border-radius:50%; flex:none;
    background:linear-gradient(160deg,#2a2118,#0f0b06);
    border:1px solid var(--borde); display:grid; place-items:center; font-size:19px;
  }
  .quien{font-size:10px; letter-spacing:2.5px; color:var(--tenue)}
  /* La cuenta de la mano. Es EL número de esta pantalla: el jugador lo mira
     antes de cada decisión, muchas veces con el teléfono en la mano y a
     distancia de brazo. Va grande, con su propio aro, y es lo que más pesa
     visualmente después de las cartas. */
  .cuenta{
    font-size:22px; line-height:1; color:var(--oro); font-weight:700;
    background:rgba(0,0,0,.45); border:1px solid rgba(255,216,74,.35);
    border-radius:22px; padding:7px 16px; display:inline-block; margin-top:4px;
    min-width:54px; text-align:center; letter-spacing:.5px;
    text-shadow:0 0 12px rgba(255,216,74,.25);
  }
  /* El "blando" y el "+ ?" son aclaraciones, no el número: van más chicos y
     pegados, para que no le compitan de tamaño. */
  .cuenta .nota{font-size:12px; font-weight:400; color:var(--tenue); letter-spacing:1px}

  /* Las cartas se montan un poco unas sobre otras, como una mano repartida
     de verdad. El índice va arriba a la izquierda justamente para que se siga
     leyendo aunque la de al lado la tape; y así entran cinco cartas en el
     ancho de un teléfono sin que se corten a otro renglón. */
  .cartas{display:flex; min-height:112px; align-items:flex-start; margin:8px 0 8px; padding-left:2px}
  .carta{
    width:76px; height:110px; border-radius:9px; flex:none; position:relative;
    margin-left:-16px;
    background:linear-gradient(160deg,#fffdf5,#ece6d6 70%,#ddd5c0);
    border:1px solid #b9b09a;
    box-shadow:0 4px 12px rgba(0,0,0,.55), inset 0 1px 0 #fff;
    color:#1a1a1a; font-family:Georgia,serif;
  }
  .carta:first-child{margin-left:0}
  .carta.roja{color:var(--rojo)}
  /* El índice de la esquina: el valor y abajo su palo, como en una baraja de
     verdad. Va arriba a la izquierda y repetido al revés abajo a la derecha,
     para que la carta se lea de las dos maneras y también cuando la de al
     lado la tapa. */
  .carta .idx{position:absolute; left:6px; top:5px; line-height:1; text-align:center}
  .carta .idx.abajo{left:auto; right:6px; top:auto; bottom:5px; transform:rotate(180deg)}
  .carta .idx .v{font-size:15px; font-weight:700; display:block}
  .carta .idx .p{font-size:11px; display:block; margin-top:1px}
  .carta .palo{position:absolute; inset:0; display:grid; place-items:center; font-size:38px}
  .carta .palo.as{font-size:52px}
  /* Las figuras. Como en la baraja: la misma media figura arriba y repetida
     boca abajo, de modo que la carta no tiene derecho ni revés. */
  .carta .fig{position:absolute; left:15px; right:15px; top:5px; bottom:5px; display:flex; flex-direction:column}
  .carta .fig svg{width:100%; height:50%; fill:currentColor; display:block}
  .carta .fig svg:last-child{transform:rotate(180deg)}
  /* La cara va del color del papel, recortada sobre la silueta: es lo que la
     hace una cara y no una mancha. */
  .carta .fig .cara{fill:#f6f2e6}
  .carta.tapada{
    background:
      repeating-linear-gradient(45deg,#7a1f1f 0 6px,#5e1616 6px 12px);
    border-color:#3d0f0f;
  }
  .carta.tapada::after{
    content:''; position:absolute; inset:6px; border:1px solid rgba(255,216,74,.35); border-radius:4px;
  }
  /* El reparto: la carta entra deslizándose desde arriba. */
  @keyframes reparte{
    from{transform:translateY(-90px) rotate(-8deg); opacity:0}
    to{transform:none; opacity:1}
  }
  .carta.nueva{animation:reparte .34s cubic-bezier(.2,.8,.3,1) both}

  .mano{border-radius:10px; padding:2px 8px 2px; margin:0 -8px}
  .mano.activa{background:rgba(255,216,74,.07); box-shadow:inset 0 0 0 1px rgba(255,216,74,.3)}

  .resultado{font-size:12px; letter-spacing:2px; font-weight:700; margin-top:-6px}
  .gana{color:var(--verde)} .pierde{color:#e57373} .empate{color:var(--tenue)} .natural{color:var(--oro)}

  .botones{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px}
  button{
    font-family:Georgia,serif; font-size:12px; letter-spacing:2px; font-weight:700;
    padding:11px 16px; border-radius:8px; cursor:pointer; color:#1a1206;
    background:linear-gradient(180deg,#ffe98a,#d4a017); border:1px solid #8a6a10;
    box-shadow:0 3px 0 #6d5410, 0 5px 12px rgba(0,0,0,.45);
  }
  button:active{transform:translateY(2px); box-shadow:0 1px 0 #6d5410}
  button[disabled]{opacity:.35; cursor:not-allowed; box-shadow:none; transform:none}
  button.gris{background:linear-gradient(180deg,#5c5c5c,#3a3a3a); color:#e8dcc0; border-color:#2a2a2a; box-shadow:0 3px 0 #222}

  .barra{
    width:100%; max-width:520px; display:flex; justify-content:space-between; align-items:center;
    margin-top:12px; font-size:11px; color:var(--tenue); letter-spacing:1px;
  }
  .saldo{color:var(--oro); font-size:15px; font-weight:700; letter-spacing:0}
  .sonido{cursor:pointer; font-size:14px; opacity:.8; user-select:none}
  .sonido.mudo{opacity:.35}
  /* ── Las fichas ────────────────────────────────────────────────────────
     Cada valor tiene SU color, como en cualquier casino: el jugador aprende
     a leer la apuesta de un vistazo, sin contar números. Se respeta la
     convención internacional donde existe (negra 100, violeta 500), porque
     el que ya jugó en otro lado la reconoce sin que nadie se la explique.
     El dibujo es el clásico: cuerpo de color con las muescas blancas del
     canto y la cara más clara en el medio. */
  .fichas{display:flex; gap:9px; justify-content:center; margin-top:14px; flex-wrap:wrap}
  .ficha{
    width:50px; height:50px; border-radius:50%; display:grid; place-items:center; cursor:pointer;
    font-size:13px; font-weight:700; font-family:Georgia,serif; flex:none;
    color:var(--texto-ficha); user-select:none;
    background:
      radial-gradient(circle at 50% 50%, var(--cara) 0 55%, transparent 55%),
      repeating-conic-gradient(from 9deg, var(--muesca) 0 13deg, var(--cuerpo) 13deg 32deg);
    border:1px solid rgba(0,0,0,.5);
    box-shadow:0 3px 7px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.18);
    text-shadow:0 1px 1px rgba(0,0,0,.35);
    transition:transform .08s;
  }
  .ficha:active{transform:translateY(3px) scale(.96)}
  .ficha[disabled]{opacity:.3; pointer-events:none}

  /* ── El sitio de la apuesta ────────────────────────────────────────────
     En una mesa de verdad el círculo está PINTADO en el paño y no se va a
     ninguna parte: las fichas se ponen ahí y se quedan ahí mientras se juega
     la mano. Por eso acá también está siempre, debajo de las cartas, que es
     donde está en la mesa (el jugador tiene el círculo del lado de adentro y
     las cartas del lado del crupier). */
  .zona-apuesta{
    display:flex; align-items:center; justify-content:center; gap:16px; margin:0 0 6px;
  }
  .circulo{
    width:84px; height:84px; border-radius:50%; position:relative; flex:none;
    border:2px solid rgba(255,236,190,.22);
    box-shadow:
      inset 0 0 0 5px rgba(0,0,0,.14),
      inset 0 0 0 6px rgba(255,236,190,.13),
      inset 0 0 22px rgba(0,0,0,.4);
    display:grid; place-items:center;
  }
  .circulo.tocable{cursor:pointer}
  .circulo .rotulo{
    font-size:8px; letter-spacing:2.5px; color:rgba(255,236,190,.32); text-align:center; line-height:1.9;
  }
  /* La pila: las fichas de canto, una encima de la otra. */
  .pila{position:absolute; bottom:16px; left:50%; transform:translateX(-50%); width:50px}
  .pila .ficha{margin-top:-42px; cursor:inherit; pointer-events:none; width:50px; height:50px}
  .pila .ficha:first-child{margin-top:0}

  .monto{text-align:left; line-height:1.15}
  .monto b{display:block; font-size:21px; color:var(--oro); font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.7)}
  .monto small{font-size:8px; letter-spacing:2.5px; color:rgba(255,236,190,.4)}

  .msg{max-width:520px; width:100%; margin-top:10px; font-size:11.5px; text-align:center; min-height:16px; line-height:1.5}
  .msg.mal{color:#e57373}

  form{display:flex; flex-direction:column; gap:8px; width:100%; max-width:300px; margin-top:18px}
  input{
    font-family:Georgia,serif; font-size:14px; padding:10px 12px; border-radius:8px;
    background:#160f08; border:1px solid var(--borde); color:var(--texto);
  }
  .oculto{display:none !important}
</style>
</head>
<body>

<div class="marca">VOLTIO <small>MAQUETA · BLACKJACK</small></div>
<div class="aviso">Maqueta B1 · la pantalla de verdad llega en la B3 · todo lo decide el servidor</div>

<!-- ── Entrar ─────────────────────────────────────────────────────────── -->
<form id="entrar">
  <input id="usuario" placeholder="usuario" autocomplete="username">
  <input id="clave" type="password" placeholder="clave" autocomplete="current-password">
  <button type="submit">ENTRAR</button>
</form>

<!-- Los avisos van ACÁ, fuera de la mesa: si vivieran adentro, un error al
     entrar (clave mal, mesa cerrada) se escribiría en una parte de la página
     que todavía está oculta y el usuario no vería nada. -->
<div class="msg" id="msg"></div>

<!-- ── La mesa ────────────────────────────────────────────────────────── -->
<div id="juego" class="oculto" style="width:100%; display:flex; flex-direction:column; align-items:center">

  <div class="barra">
    <span id="quien"></span>
    <span><span class="sonido" id="sonido" title="Sonido">🔊</span> saldo <span class="saldo" id="saldo">—</span></span>
  </div>

  <div class="mesa">
   <div class="paño">
    <div class="fila-crupier">
      <div class="avatar">🎩</div>
      <div>
        <div class="quien">CRUPIER</div>
        <div class="cuenta" id="cuenta-crupier">—</div>
      </div>
    </div>
    <div class="cartas" id="cartas-crupier"></div>

    <div class="arco"></div>
    <div class="marca-paño">VOLTIO</div>
    <div class="letrero" id="letrero"></div>

    <div class="quien" style="margin-bottom:2px" id="rotulo-jugador">TU MANO</div>
    <div id="manos"></div>

    <div class="botones" id="botones"></div>
   </div>
  </div>

  <div class="fichas" id="fichas"></div>
</div>

<script>
// ── Hablar con el servidor ───────────────────────────────────────────────
let TOKEN = null;
async function api(ruta, metodo, cuerpo){
  const res = await fetch(ruta, {
    method: metodo || 'GET',
    headers: Object.assign({'Content-Type':'application/json'}, TOKEN ? {Authorization:'Bearer '+TOKEN} : {}),
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const data = await res.json().catch(function(){ return {}; });
  data.__status = res.status;
  return data;
}

// ── Estado ───────────────────────────────────────────────────────────────
// E es lo ÚLTIMO que dijo el servidor. Es la única fuente de verdad: acá no
// se calcula ni se recuerda nada del juego.
let E = null;
// La apuesta no es un número que se elige: es una PILA de fichas que se van
// poniendo, como en la mesa. Sumando 10 y 20 se llega a cualquier monto, y el
// jugador ve de qué está hecha su apuesta.
let PILA = [];
const montoApuesta = function(){ return PILA.reduce(function(s, v){ return s + v; }, 0); };
let ocupado = false;

// Cada valor, su color. Donde existe convención internacional se respeta
// (negra 100, violeta 500): el que ya jugó en otro lado la reconoce solo.
const FICHAS = [
  { v:10,  cuerpo:'#cfc9b6', muesca:'#ffffff', cara:'#efebdd', texto:'#2b2b2b' }, // hueso
  { v:20,  cuerpo:'#a82126', muesca:'#ffffff', cara:'#cc3b39', texto:'#fff'    }, // roja
  { v:50,  cuerpo:'#15693f', muesca:'#ffffff', cara:'#238f58', texto:'#fff'    }, // verde
  { v:100, cuerpo:'#141414', muesca:'#ffffff', cara:'#2f2f2f', texto:'#fff'    }, // negra
  { v:500, cuerpo:'#4c2578', muesca:'#ffffff', cara:'#6c3aa3', texto:'#fff'    }, // violeta
];
const fichaDe = function(v){
  return FICHAS.find(function(f){ return f.v === v; }) || FICHAS[0];
};
function pintarUnaFicha(f, texto){
  const d = document.createElement('div');
  d.className = 'ficha';
  d.style.cssText = '--cuerpo:' + f.cuerpo + '; --muesca:' + f.muesca
    + '; --cara:' + f.cara + '; --texto-ficha:' + f.texto;
  d.textContent = texto != null ? texto : f.v;
  return d;
}
// Qué cartas ya se dibujaron, para animar sólo las que llegan nuevas.
let mostradas = new Set();

const $ = function(id){ return document.getElementById(id); };
const PALOS = { S:'♠', H:'♥', D:'♦', C:'♣' };
const ROJOS = { H:1, D:1 };

// ── Las figuras ──────────────────────────────────────────────────────────
// Rey, reina y jota dibujados a mano en SVG: nada que descargar, y como
// heredan el color de la carta salen negros o rojos solos, según el palo.
// La cara va del color del papel recortada sobre la silueta — eso es lo que
// la hace una cara y no una mancha.
// El cuerpo lleva el escote en rombo del color del papel: sin él la cabeza y
// los hombros se funden en una sola mancha y no se entiende qué se está
// mirando. Es el mismo truco de las barajas de toda la vida.
const CUERPO = '<path d="M2.5 44v-8.5q4.5-3.6 14.5-4.6 10 1 14.5 4.6V44z"/>'
             + '<path class="cara" d="M17 30.9 21.6 36.4 17 41.2 12.4 36.4z"/>';
const OJOS = '<circle cx="14.8" cy="20.8" r=".9"/><circle cx="19.2" cy="20.8" r=".9"/>';
const BOCA = '<path d="M15.2 24.6q1.8 1.5 3.6 0-.8 1.95-1.8 1.95t-1.8-1.95z"/>';

const FIGURAS_CARTA = {
  // El rey: corona de puntas y barba partida. La barba llega hasta antes del
  // cuerpo, así queda papel en el medio y no se pegan.
  K: '<svg viewBox="0 0 34 44">'
   + '<path d="M4 16V4.5l6.6 5.2L17 2l6.4 7.7L30 4.5V16z"/>'
   + '<circle cx="17" cy="22" r="6.9"/>'
   + '<ellipse class="cara" cx="17" cy="21.2" rx="4.7" ry="5.3"/>'
   + OJOS
   + '<path d="M12.5 24.3q4.5 3.1 9 0-1.7 5.4-4.5 5.4t-4.5-5.4z"/>'
   + CUERPO + '</svg>',
  // La reina: diadema de tres joyas sobre una banda, y dos mechones largos.
  // Se probó con el pelo como una sola masa y le comía el cuerpo entero.
  Q: '<svg viewBox="0 0 34 44">'
   + '<circle cx="17" cy="8.2" r="1.8"/><circle cx="11.6" cy="10.2" r="1.35"/><circle cx="22.4" cy="10.2" r="1.35"/>'
   + '<path d="M9.4 16q0-4.8 7.6-4.8t7.6 4.8z"/>'
   + '<circle cx="17" cy="22" r="7"/>'
   + '<path d="M10.4 25.2q-1.5 5.2-1.5 9.3h3.1q0-4.2 1.1-8.3z"/>'
   + '<path d="M23.6 25.2q1.5 5.2 1.5 9.3H22q0-4.2-1.1-8.3z"/>'
   + '<ellipse class="cara" cx="17" cy="21.4" rx="4.7" ry="5.3"/>'
   + OJOS + BOCA
   + CUERPO + '</svg>',
  // La jota: gorro blando con pluma y sin barba — es el joven de la baraja.
  J: '<svg viewBox="0 0 34 44">'
   + '<path d="M23.4 9 30.2 1.2l1.1 4.4z"/>'
   + '<circle cx="17" cy="22" r="6.7"/>'
   + '<path d="M6.9 16q0-8.2 10.1-8.2T27.1 16z"/>'
   + '<ellipse class="cara" cx="17" cy="21.4" rx="4.8" ry="5.4"/>'
   + OJOS + BOCA
   + CUERPO + '</svg>',
};

// ── El sonido de la mesa ─────────────────────────────────────────────────
// Todo se fabrica acá con Web Audio: ni un archivo, ni una descarga. Son tres
// ruidos y ninguno dura más de un cuarto de segundo — en una mesa lo que se
// oye es el golpe seco de la arcilla y el roce de la carta, no una orquesta.
// El navegador no deja sonar hasta que el usuario tocó algo, así que el
// contexto se crea recién en el primer toque.
let AC = null;
let MUDO = false;

function audio(){
  if (MUDO) return null;
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

// Un pedazo de ruido blanco, que es la materia prima de casi todo golpe.
function ruido(ac, dur){
  const n = Math.max(1, Math.floor(ac.sampleRate * dur));
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function golpe(ac, t, { frec, q, vol, dur }){
  const src = ac.createBufferSource(); src.buffer = ruido(ac, dur);
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = frec; bp.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(t); src.stop(t + dur + 0.01);
}

function tono(ac, t, frec, vol, dur, tipo){
  const o = ac.createOscillator(); o.type = tipo || 'triangle'; o.frequency.value = frec;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0008, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

// La ficha: el golpe seco de la arcilla contra el paño, más el tintineo de
// caer sobre las que ya están.
function sonarFicha(){
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  golpe(ac, t, { frec: 1500, q: 1.1, vol: 0.30, dur: 0.07 });
  tono(ac, t + 0.004, 2550, 0.05, 0.05);
  tono(ac, t + 0.010, 3350, 0.035, 0.045);
}

// La carta: el roce del cartón al deslizarse sobre el fieltro.
function sonarCarta(){
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = ruido(ac, 0.14);
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
  bp.frequency.setValueAtTime(3200, t);
  bp.frequency.exponentialRampToValueAtTime(700, t + 0.13);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0008, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.14);
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(t); src.stop(t + 0.15);
}

// El cierre de la mano. Corto: un resultado no se festeja diez segundos.
function sonarResultado(manos){
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const res = (manos || []).map(function(h){ return h.resultado; });
  if (res.indexOf('natural') >= 0) {
    [784, 988, 1319, 1568].forEach(function(f, i){ tono(ac, t + i * 0.075, f, 0.12, 0.3); });
  } else if (res.indexOf('gana') >= 0) {
    [660, 880].forEach(function(f, i){ tono(ac, t + i * 0.085, f, 0.11, 0.26); });
  } else if (res.every(function(r){ return r === 'empate'; })) {
    tono(ac, t, 440, 0.07, 0.2);
  } else {
    tono(ac, t, 200, 0.10, 0.3, 'sine');
    tono(ac, t + 0.06, 150, 0.08, 0.32, 'sine');
  }
}

// Cuántas cartas nuevas lleva este dibujado, para que suenen una detrás de
// otra y no todas encimadas.
let cartasNuevas = 0;
let primerDibujado = true;

function decir(texto, mal){
  $('msg').textContent = texto || '';
  $('msg').className = 'msg' + (mal ? ' mal' : '');
}

// ── Dibujar una carta ────────────────────────────────────────────────────
function dibujarCarta(carta, clave){
  const d = document.createElement('div');
  const nueva = !mostradas.has(clave);
  if (nueva) {
    mostradas.add(clave);
    // Cada carta nueva suena al llegar, escalonada como el reparto. En el
    // primer dibujado no: si el jugador recarga la página en medio de una
    // mano, no tienen que sonarle de golpe las cuatro cartas que ya estaban.
    if (!primerDibujado) {
      const cuando = cartasNuevas++ * 130;
      setTimeout(sonarCarta, cuando);
    }
  }

  if (carta && typeof carta === 'object' && carta.tapada) {
    d.className = 'carta tapada' + (nueva ? ' nueva' : '');
    return d;
  }
  const rango = String(carta)[0], palo = String(carta)[1];
  const valor = rango === 'T' ? '10' : rango;
  const simbolo = PALOS[palo];
  d.className = 'carta' + (ROJOS[palo] ? ' roja' : '') + (nueva ? ' nueva' : '');

  const indice = '<span class="v">' + valor + '</span><span class="p">' + simbolo + '</span>';
  // La figura va dos veces: derecha arriba y boca abajo abajo, como en la
  // baraja. Las demás llevan su palo en el medio, y el as más grande.
  const centro = FIGURAS_CARTA[rango]
    ? '<div class="fig">' + FIGURAS_CARTA[rango] + FIGURAS_CARTA[rango] + '</div>'
    : '<div class="palo' + (rango === 'A' ? ' as' : '') + '">' + simbolo + '</div>';

  d.innerHTML = '<div class="idx">' + indice + '</div>'
              + centro
              + '<div class="idx abajo">' + indice + '</div>';
  return d;
}

const NOMBRE = { gana:'GANASTE', pierde:'PERDISTE', empate:'EMPATE', natural:'¡BLACKJACK!' };

// ── Dibujar todo ─────────────────────────────────────────────────────────
function pintar(){
  cartasNuevas = 0;
  $('saldo').textContent = (E.balance != null ? E.balance : 0).toLocaleString('es-VE');

  // El crupier. Mientras la mano vive, la segunda carta viene tapada y el
  // número que se muestra es sólo lo que se ve — el servidor no manda más.
  const cc = $('cartas-crupier'); cc.innerHTML = '';
  const cartasC = (E.crupier && E.crupier.cartas) || [];
  cartasC.forEach(function(c, i){ cc.appendChild(dibujarCarta(c, 'c'+i)); });
  $('cuenta-crupier').innerHTML = E.crupier
    ? (E.crupier.total + (E.crupier.parcial ? ' <span class="nota">+ ?</span>' : ''))
    : '—';

  // Las manos.
  const cont = $('manos'); cont.innerHTML = '';
  (E.manos || []).forEach(function(h){
    const caja = document.createElement('div');
    const activa = E.estado === 'jugando' && h.indice === E.mano_activa && h.estado === 'jugando';
    caja.className = 'mano' + (activa ? ' activa' : '');

    const fila = document.createElement('div');
    fila.className = 'cartas';
    h.cartas.forEach(function(c, i){ fila.appendChild(dibujarCarta(c, 'm'+h.indice+'-'+i)); });
    caja.appendChild(fila);

    const pie = document.createElement('div');
    pie.style.cssText = 'display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:-2px; margin-bottom:6px';
    pie.innerHTML = '<span class="cuenta">' + h.total
        + (h.blando ? ' <span class="nota">blando</span>' : '') + '</span>'
      + (h.resultado
          ? '<span class="resultado ' + h.resultado + '">' + NOMBRE[h.resultado]
            + (h.pago ? ' · +' + h.pago : '') + '</span>'
          : '');
    caja.appendChild(pie);
    cont.appendChild(caja);
  });

  const jugando = E.estado === 'jugando';
  $('rotulo-jugador').textContent = jugando ? 'TU MANO' : 'TU APUESTA';

  // El sitio de la apuesta, SIEMPRE. Mientras se juega muestra las fichas que
  // están en juego (y no se pueden tocar); entre mano y mano, las que estás
  // poniendo.
  const enJuego = (E.manos || []).reduce(function(s, h){ return s + h.apuesta; }, 0);
  cont.appendChild(zonaDeApuesta(jugando ? enJuego : montoApuesta(), !jugando));

  // Los botones: los que dice el servidor, ni uno más.
  const bs = $('botones'); bs.innerHTML = '';
  if (jugando) {
    (E.acciones || []).forEach(function(a){
      const b = document.createElement('button');
      b.textContent = { pedir:'PEDIR', plantarse:'PLANTARME', doblar:'DOBLAR', dividir:'DIVIDIR' }[a] || a.toUpperCase();
      if (a !== 'pedir') b.className = 'gris';
      b.disabled = ocupado;
      b.onclick = function(){ jugar(a); };
      bs.appendChild(b);
    });
  } else {
    const min = (E.mesa && E.mesa.apuesta_min) || 10;
    const monto = montoApuesta();
    const b = document.createElement('button');
    b.textContent = monto ? ('APOSTAR ' + monto) : ('PONÉ AL MENOS ' + min);
    b.disabled = ocupado || monto < min;
    b.onclick = apostar;
    bs.appendChild(b);
    if (PILA.length) {
      const l = document.createElement('button');
      l.className = 'gris'; l.textContent = 'LEVANTAR';
      l.disabled = ocupado;
      l.onclick = function(){ PILA = []; pintarFichas(); pintar(); };
      bs.appendChild(l);
    }
  }

  // El fichero sólo entre mano y mano.
  $('fichas').style.display = jugando ? 'none' : 'flex';
  if (!jugando) pintarFichas();
}

// Con qué fichas se dibuja un monto. Se usan LAS QUE EL JUGADOR PUSO siempre
// que se pueda, para que la pila del paño sea la suya y no una inventada:
//  · mientras arma la apuesta, son exactamente esas;
//  · si dobló, el servidor cobra el doble → se pone al lado la misma pila otra
//    vez, que es lo que se hace en la mesa;
//  · y si por lo que sea no coincide, se arma con las fichas más grandes que
//    entren, como cuando el crupier te cambia el montón por fichas grandes.
function pilaPara(monto){
  const suma = montoApuesta();
  if (monto === suma && PILA.length) return PILA.slice();
  if (suma && monto === suma * 2) return PILA.concat(PILA);
  const fichas = [];
  let resto = monto;
  FICHAS.slice().sort(function(a, b){ return b.v - a.v; }).forEach(function(f){
    while (resto >= f.v) { fichas.push(f.v); resto -= f.v; }
  });
  return fichas;
}

// El sitio de la apuesta: el círculo pintado en el paño con las fichas
// adentro, y el monto al lado.
function zonaDeApuesta(monto, editable){
  const zona = document.createElement('div');
  zona.className = 'zona-apuesta';

  const c = document.createElement('div');
  c.className = 'circulo' + (editable && monto ? ' tocable' : '');

  if (!monto) {
    c.innerHTML = '<div class="rotulo">PONÉ<br>TUS FICHAS</div>';
    zona.appendChild(c);
    return zona;
  }

  // Tocar la pila saca la última ficha puesta: es el gesto que sale solo
  // cuando uno se pasa, y evita levantar toda la apuesta por una ficha de
  // más. Con la mano en juego no se toca: esas fichas ya están apostadas.
  if (editable) {
    c.title = 'Tocá para sacar la última ficha';
    c.onclick = function(){
      if (ocupado || !PILA.length) return;
      PILA.pop(); sonarFicha(); pintar();
    };
  }

  const pila = document.createElement('div');
  pila.className = 'pila';
  // Las grandes abajo, como se apilan de verdad. La de arriba muestra su
  // valor; de las de abajo se ve sólo el canto.
  pilaPara(monto).sort(function(a, b){ return b - a; }).forEach(function(v, i, todas){
    pila.appendChild(pintarUnaFicha(fichaDe(v), i === todas.length - 1 ? String(v) : ''));
  });
  c.appendChild(pila);
  zona.appendChild(c);

  const m = document.createElement('div');
  m.className = 'monto';
  m.innerHTML = '<b>' + monto.toLocaleString('es-VE') + '</b><small>'
    + (editable ? 'APUESTA' : 'EN JUEGO') + '</small>';
  zona.appendChild(m);
  return zona;
}

// El fichero: se toca una ficha y se SUMA a la apuesta. Así se sube de 10 en
// 10, de 20 en 20, o como se quiera.
function pintarFichas(){
  const f = $('fichas'); f.innerHTML = '';
  const max = (E && E.mesa && E.mesa.apuesta_max) || 500;
  FICHAS.filter(function(x){ return x.v <= max; }).forEach(function(x){
    const d = pintarUnaFicha(x);
    // Si esta ficha ya no entra en el máximo de la mesa, se apaga en vez de
    // dejar que la toque y le salte un error.
    if (montoApuesta() + x.v > max) d.setAttribute('disabled', '');
    d.onclick = function(){
      if (montoApuesta() + x.v > max) return;
      PILA.push(x.v);
      sonarFicha();
      decir('');
      pintar();
    };
    f.appendChild(d);
  });
}

// ── Jugadas ──────────────────────────────────────────────────────────────
// `version` va en CADA jugada: es lo que hace que un doble clic no reparta dos
// cartas. El servidor lo exige, y con razón.
async function jugar(accion){
  if (ocupado) return;
  ocupado = true; pintar();
  const r = await api('/api/bj/' + accion, 'POST', { ronda: E.ronda, version: E.version });
  ocupado = false;
  if (r.error && !r.manos) { decir(r.error, true); pintar(); return; }
  decir(r.error || '', !!r.error);
  E = r; pintar(); cierre(r);
}

// El sonido del resultado, después de que terminaron de caer las cartas: si
// suena encima del reparto no se entiende ninguno de los dos.
function cierre(r){
  if (!r || r.estado !== 'cerrada') return;
  setTimeout(function(){ sonarResultado(r.manos); }, cartasNuevas * 130 + 260);
}

async function apostar(){
  if (ocupado) return;
  ocupado = true; decir('');
  const r = await api('/api/bj/apostar', 'POST', { mesa: 'blackjack', apuesta: montoApuesta() });
  ocupado = false;
  if (!r.ronda) { decir(r.error || 'No se pudo abrir la mano', true); pintar(); return; }
  mostradas = new Set();   // mano nueva: todas las cartas se animan
  E = r; pintar(); cierre(r);
  if (E.estado === 'cerrada') decir('Se resolvió en el reparto.');
}

// ── Entrar ───────────────────────────────────────────────────────────────
$('entrar').onsubmit = async function(ev){
  ev.preventDefault();
  decir('');
  const r = await api('/api/auth/login', 'POST', {
    username: $('usuario').value.trim(), password: $('clave').value,
  });
  if (!r.token) { decir(r.error || 'No pude entrar', true); return; }
  TOKEN = r.token;
  const est = await api('/api/bj/ronda?mesa=blackjack');
  if (!est.mesa) { decir(est.error || 'No encontré la mesa. ¿Corriste la migración 012?', true); return; }
  if (!est.mesa.activo) {
    decir('La mesa de blackjack está CERRADA. Encendela en local con:  '
      + 'curl -X POST localhost:8795/api/admin/games/blackjack/activo -H "Authorization: Bearer <token de admin>" '
      + '-H "Content-Type: application/json" -d \'{"activo":true}\'', true);
  }
  $('entrar').classList.add('oculto');
  $('juego').classList.remove('oculto');
  $('quien').textContent = ($('usuario').value.trim() || '').toUpperCase()
    + ' · ' + (est.mesa.label || '') + ' · ' + est.mesa.mazos + ' mazos'
    + ' · natural ' + (est.mesa.pago_natural === 1.5 ? '3:2' : est.mesa.pago_natural);
  // La leyenda del paño sale de la ficha de la mesa, no escrita a mano: si el
  // dueño cambia el pago del natural, el paño lo dice solo.
  const nat = est.mesa.pago_natural === 1.5 ? '3 A 2'
            : est.mesa.pago_natural === 1.2 ? '6 A 5'
            : est.mesa.pago_natural + ' A 1';
  // Dos renglones, cada uno entero: cortado a mitad de frase se lee como un
  // error. El tercero se lo lleva la marca del paño, que va justo arriba.
  $('letrero').innerHTML = '<b>EL BLACKJACK PAGA ' + nat + '</b>'
    + 'EL CRUPIER SE PLANTA EN 17 · APUESTAS '
    + est.mesa.apuesta_min + ' A ' + est.mesa.apuesta_max;

  E = est;
  // El círculo arranca vacío, como en la mesa: las fichas las pone el jugador.
  // Después de cada mano la pila queda como estaba, así repetir la apuesta es
  // apretar un botón.
  PILA = [];
  mostradas = new Set();
  primerDibujado = true;   // lo que ya estaba en la mesa no suena
  pintar();
  primerDibujado = false;
};

// El botón de silencio. Suena poco y corto, pero nadie tiene por qué
// aguantarse el sonido de una mesa si no quiere.
$('sonido').onclick = function(){
  MUDO = !MUDO;
  $('sonido').textContent = MUDO ? '🔇' : '🔊';
  $('sonido').className = 'sonido' + (MUDO ? ' mudo' : '');
  if (!MUDO) sonarFicha();
};
</script>
